name: Browser Smoke

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check source and tests
        run: |
          find src tests -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Run browser regression suite
        run: npm run test:browser-regression

      - name: Run browser stress suite
        run: npm run test:browser-stress
